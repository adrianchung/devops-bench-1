apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: default
  labels:
    app: webapp
    bench: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: webapp
        image: nginx:1.25
        # Intentionally wrong config path — causes CrashLoopBackOff.
        # Fix: remove command/args override so nginx uses its default config.
        command: ["/bin/sh", "-c"]
        args: ["nginx -g 'daemon off;' -c /etc/nginx/sites/custom.conf"]
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
