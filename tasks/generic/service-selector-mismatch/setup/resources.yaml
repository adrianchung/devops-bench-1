apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: default
  labels:
    app: api-server
    bench: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
      - name: api
        image: nginx:1.25
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: default
  labels:
    bench: "true"
spec:
  # Intentionally wrong selector — typo "apiserver" vs actual label "api-server".
  # Fix: change selector to app=api-server.
  selector:
    app: apiserver
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP
