apiVersion: v1
kind: Namespace
metadata:
  name: restricted
  labels:
    bench: "true"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: compute-quota
  namespace: restricted
spec:
  # Quota deliberately tight: only 200m CPU and 256Mi memory total.
  # Each pod requests 200m CPU, so even 1 pod fills the quota and 3 replicas fail.
  # Fix: reduce per-pod CPU requests to e.g. 50m so replicas fit within quota.
  hard:
    requests.cpu: "200m"
    requests.memory: "256Mi"
    limits.cpu: "400m"
    limits.memory: "512Mi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: restricted
  labels:
    app: worker
    bench: "true"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: nginx:1.25
        # Each replica requests 200m CPU — with 3 replicas that's 600m total,
        # exceeding the 200m quota. Pods cannot be created.
        resources:
          requests:
            cpu: "200m"
            memory: "128Mi"
          limits:
            cpu: "400m"
            memory: "256Mi"
